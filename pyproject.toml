[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-lecture-html"
version = "0.1.0"
description = "Convert Chinese technical lecture videos into searchable static HTML study notes (hybrid keyframes + ASR)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "MJX1010" }]
keywords = ["asr", "funasr", "lecture", "html", "ffmpeg", "keyframe", "chinese"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Topic :: Education",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "jinja2>=3.1",
  "pillow>=10.0",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
funasr = ["funasr>=1.1", "modelscope>=1.11", "torch"]
whisper = ["faster-whisper>=1.0"]
ocr = ["paddlepaddle", "paddleocr>=2.7"]
dev = ["pytest>=7.0"]

[project.scripts]
vlh = "vlh.cli:app"

[project.urls]
Homepage = "https://github.com/MJX1010/video-lecture-html"
Issues = "https://github.com/MJX1010/video-lecture-html/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vlh = ["py.typed", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
